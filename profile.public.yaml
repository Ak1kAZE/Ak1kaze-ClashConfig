dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  ipv6: true
  prefer-ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - "+.localdomain"
  - localhost.ptlogin2.qq.com
  - time.windows.com
  - time.apple.com
  - time.android.com
  - "+.xn--ngstr-lra8j.com"
  - "+.ntp.org.cn"
  - "+.pool.ntp.org"
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    "geosite:private,cn,geolocation-cn,microsoft@cn,steam@cn":
    - 223.5.5.5
    - 119.29.29.29
    "+.google.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.googleapis.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.googleapis.cn":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.gstatic.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.gvt1.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.gvt2.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.gvt3.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.googleusercontent.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.ggpht.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.android.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.xn--ngstr-lra8j.com":
    - https://1.1.1.1/dns-query#谷歌服务
    - https://dns.google/dns-query#谷歌服务
    "+.openai.com":
    - https://1.1.1.1/dns-query#AI服务
    - https://dns.google/dns-query#AI服务
    "+.chatgpt.com":
    - https://1.1.1.1/dns-query#AI服务
    - https://dns.google/dns-query#AI服务
    "+.anthropic.com":
    - https://1.1.1.1/dns-query#AI服务
    - https://dns.google/dns-query#AI服务
    "+.claude.ai":
    - https://1.1.1.1/dns-query#AI服务
    - https://dns.google/dns-query#AI服务
    "geosite:geolocation-!cn":
    - https://1.1.1.1/dns-query#国外网站
    - https://dns.google/dns-query#国外网站
  nameserver:
  - https://1.1.1.1/dns-query#国外网站
  - https://1.0.0.1/dns-query#国外网站
  - https://dns.google/dns-query#国外网站
  fallback:
  - https://1.1.1.1/dns-query#国外网站
  - https://dns.google/dns-query#国外网站
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4

